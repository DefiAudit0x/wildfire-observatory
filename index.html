<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="description" content="منصة مجتمعية لرصد ومتابعة حرائق الغابات والكوارث في شمال إفريقيا" />
    <meta name="robots" content="index, follow" />
    <!-- W-M13: the API host is covered by Helmet, but the static shell (Vercel,
         and the server's own dist fallback) shipped with NO CSP and NO referrer
         policy. This meta is the shell's defense-in-depth baseline and mirrors
         the server's Helmet directives plus frame-ancestors/base-uri/form-action
         hardening. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss: https://firms.modaps.eosdis.nasa.gov https://tile.openstreetmap.org https://*.tile.opentopomap.org https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://api.open-meteo.com https://router.project-osrm.org https://nominatim.openstreetmap.org; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>المرصد الجزائري لحرائق الغابات والكوارث</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0505;color:#e2e8f0;text-align:center;padding:2rem;font-family:sans-serif">
        <p>هذه المنصة تتطلب تفعيل جافاسكربت (JavaScript) لمتابعة حرائق الغابات والكوارث في الوقت الفعلي.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
