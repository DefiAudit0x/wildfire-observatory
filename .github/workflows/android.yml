name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Build and test Android app
        run: gradle -p android test assembleDebug --stacktrace

  # v2.16.0 (audit wave 3): instrumented tests on a REAL emulator. The JVM
  # unit suite cannot execute android.jar (stubbed): the AndroidKeyStore
  # identity path, the LocationManager tier wiring and the ContextCompat
  # permission reads only run here. API 33 is the fastest-booting stable
  # image on CI hardware; KVM is available on ubuntu-latest runners.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          # First run hung: the emulator launched but never reported
          # sys.boot_completed within the default window. Hardened boot:
          # explicit headless options (software GPU, no snapshots/audio/
          # cameras/boot animation — the netsim wifi backend is the
          # known-hang path on CI images), animations off, and a 15-min
          # boot budget instead of the default 5.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          disable-animations: true
          script: gradle -p android connectedDebugAndroidTest --stacktrace

  # Release build: signs when the keystore secrets are present (they are
  # for same-repo runs; fork PRs have no secrets and fall back to an
  # UNSIGNED release — the job still verifies compile+R8 health, which is
  # the point of running it on every PR). Produces APK + AAB (Play path)
  # with sha256 checksums as downloadable artifacts.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Signing secrets absent — release build will be UNSIGNED"
          fi
      # P5-F1: on main the keystore secrets MUST exist — they do for same-repo
      # runs, so a missing signature on a main push means the secrets vanished
      # (rotation accident, org change) and every artifact would silently
      # ship unsigned. Fail loudly instead. PR runs keep the warn-and-build
      # behavior above (fork PRs have no secrets; the job still verifies
      # compile+R8 health, which is the point of running it there).
      - name: Guard — main releases must be signed (P5-F1)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNED != 'true'
        run: |
          echo "::error::Release build on main is UNSIGNED — KEYSTORE_BASE64 secret missing. Refusing to produce artifacts."
          exit 1
      - name: Build release (APK + AAB)
        run: gradle -p android assembleRelease bundleRelease --stacktrace
      - name: Verify APK signature
        if: env.SIGNED == 'true'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: SHA-256 checksums
        run: |
          cd android/app/build/outputs
          find apk/release bundle/release -type f \( -name '*.apk' -o -name '*.aab' \) -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
