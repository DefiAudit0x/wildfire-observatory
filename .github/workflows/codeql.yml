name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # ARC-L26: java-kotlin added — the mesh service (~3.3k lines incl. the
          # crypto layer) previously had zero SAST coverage.
          languages: javascript-typescript,java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
      # The Android Gradle project is nested under android/ and has no wrapper;
      # autobuild does not discover/build it. Supply its JDK, SDK, and Gradle
      # toolchain above so CodeQL observes Kotlin compilation here.
      - name: Build Android project for CodeQL
        run: gradle -p android assembleDebug --stacktrace
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
