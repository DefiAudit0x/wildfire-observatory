plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.observatory.wildfire'
    compileSdk 34

    defaultConfig {
        applicationId 'com.observatory.wildfire'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md']
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Google Nearby Connections for Bluetooth mesh
    implementation 'com.google.android.gms:play-services-nearby:19.0.0'

    // Bouncy Castle for crypto on Android (audit): bcprov-jdk15on stopped at
    // 1.70 (2021, with known CVE fixes missing) and the artifact family was
    // RELOCATED to bcprov-jdk18on — the maintained line. 1.77 keeps the
    // Java-8 bytecode baseline our minSdk 26 needs (1.81+ jumps to Java 21
    // bytecode, unloadable on Android); Jetifier is excluded for the jar in
    // gradle.properties (pure-JDK crypto, no AndroidX references).
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'

    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // JVM unit tests (MeshWire is Android-free by design — see MeshWire.kt)
    testImplementation 'junit:junit:4.13.2'
}
