plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// Release signing: credentials live in android/keystore.properties
// (gitignored — see keystore.properties.example for the shape). Without
// that file the release build type stays UNSIGNED, mirroring CI's
// no-secrets path — the build must never fail merely because a release
// certificate is not mounted (fork PRs, fresh checkouts).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.observatory.wildfire'
    compileSdk 36

    defaultConfig {
        applicationId 'com.observatory.wildfire'
        minSdk 26
        targetSdk 36
        versionCode 28
        versionName '2.20.0'

        vectorDrawables.useSupportLibrary = true
        // v2.16.0 (audit wave 3): instrumented tests land (androidTest layer
        // + the CI emulator job) — the JVM suite cannot execute android.jar.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // v2.19.0: buildConfig ON — the version badge and the API User-Agent
    // now read BuildConfig.VERSION_NAME directly. The manual pin had drifted
    // twice (badge said v2.7 on a 2.18.0 build; UA said 2.17.0) — killing
    // the class of drift bugs beats the empty-class build-time cost.
    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md']
        }
    }
}

dependencies {
    // v2.15.0 (audit — dependency drift): the explicit 1.9.22 stdlib pin
    // fought the Kotlin 2.0.21 compiler plugin (which supplies its own
    // stdlib) — resolved either misleading or as a stdlib downgrade. Let
    // the KGP provide the stdlib and fix the stale CameraX comment below.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // v2.0.0 native UI: Material components (bottom nav, M3 theme) and
    // osmdroid (offline-capable OSM map). androidx.webkit REMOVED with the
    // WebView — nothing in the app touches a browser engine anymore.
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Google Nearby Connections for Bluetooth mesh
    implementation 'com.google.android.gms:play-services-nearby:19.0.0'

    // NOTE (v1.0.3): no bundled BouncyCastle. The old bcprov-jdk18on
    // dependency was dead weight AND a trap: Android's OS-level stripped
    // provider already owns the name "BC", so insertProviderAt(bundled BC)
    // always returned -1 and pinned getInstance(..., "BC") calls resolved
    // to the OS provider — which lacks EC KeyPairGenerator — crashing
    // MeshService.onCreate on real devices. CryptoEngine now uses the
    // default provider list (Conscrypt). See CryptoProviderContractTest.

    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // v2.2.0: in-app camera capture (CameraCaptureFragment) — CameraX is
    // the Jetpack camera stack: lifecycle-aware preview + one-shot capture
    // bound to the fragment, no system camera app hop. 1.3.4 is the stable
    // line built with Kotlin 1.9 — the bundled stdlib shipped by KGP 2.0.21 remains binary-compatible.
    // v2.9.0: the capture is now EXIF-uprighted + telemetry-stamped
    // (TelemetryOverlay) — no new dependency, the stamp is pure Canvas/Paint.
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // JVM unit tests (MeshWire is Android-free by design — see MeshWire.kt)
    testImplementation 'junit:junit:4.13.2'

    // v2.16.0 (audit wave 3): instrumented tests — real Keystore for the
    // CryptoEngine identity path, real LocationManager for the tier wiring.
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
