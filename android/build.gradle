buildscript {
    ext {
        // AGP 8.9.1 is the minimum that ships android-36 compile support
        // (Play mandate: from 2026-08-31 new apps/updates must target API
        // 36). Kotlin 2.0.21 pairs with AGP 8.9.x; language level sources
        // stay 1.9-compatible.
        kotlin_version = "2.0.21"
        agp_version = "8.9.1"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
