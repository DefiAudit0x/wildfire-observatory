# fly.toml app configuration file generated for wildfire-observatory-odcibw on 2026-08-22T20:30:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wildfire-observatory-odcibw'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Owner decision 1 (Round B): keep ONE machine always warm. At 0, every
  # idle-stop and every deploy wiped the in-memory GPS registry — last-known
  # field-team positions vanished mid-shift, and only ≤5-min-old snapshots
  # survived. Cost of the floor is one shared-cpu-1x/512mb VM.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
